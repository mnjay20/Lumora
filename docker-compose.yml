services:
  postgres:
    image: postgres:16-alpine
    container_name: lumora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumora_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lumora_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/initialization:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: lumora-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lumora_user}:${POSTGRES_PASSWORD:-lumora_secret}@postgres:5432/${POSTGRES_DB:-lumora_db}
    depends_on:
      - postgres

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: lumora-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
